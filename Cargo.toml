[package]
name = "tree-police"
version = "0.1.2"
edition = "2021"
description = "Ripgrep-style AST scanner with baked-in tree-sitter queries and severity levels"
license = "Apache-2.0"

[[bin]]
name = "tree-police"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-hcl = "1"
streaming-iterator = "0.1"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
anstream = "0.6"
owo-colors = "4"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-ada = "0.1.0"
tree-sitter-adl = "0.7.0"
tree-sitter-agda = "1.3.3"
tree-sitter-bicep = "1.1.0"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-clojure = "0.1.0"
tree-sitter-cmake = "0.7.5"
tree-sitter-commonlisp = "0.4.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-crystal = "0.1.0"
tree-sitter-css = "0.25.0"
tree-sitter-cuda = "0.21.2"
tree-sitter-d = "0.8.2"
tree-sitter-dart = "0.2.0"
tree-sitter-devicetree = "0.15.0"
tree-sitter-diff = "0.1.0"
tree-sitter-elisp = "1.7.2"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-embedded-template = "0.25.0"
tree-sitter-erlang = "0.20.0"
tree-sitter-fortran = "0.6.0"
tree-sitter-fsharp = "0.3.12"
tree-sitter-gdscript = "6.1.0"
tree-sitter-gleam = "1.0.0"
tree-sitter-glsl = "0.2.0"
tree-sitter-go = "0.25.0"
tree-sitter-godot-resource = "0.7.0"
tree-sitter-graphql = "0.3.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-haskell = "0.24.1"
tree-sitter-heex = "0.8.1"
tree-sitter-html = "0.23.2"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23.5"
tree-sitter-jinja2 = "0.0.16"
tree-sitter-jsonnet = "0.0.1"
tree-sitter-julia = "0.23.1"
tree-sitter-kdl = "2.0.0"
tree-sitter-llvm = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-luau = "1.2.0"
tree-sitter-make = "1.1.1"
tree-sitter-matlab = "1.3.1"
tree-sitter-netlinx = "1.0.4"
tree-sitter-nim = "0.1.0"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.26.0"
tree-sitter-ocamllex = "0.25.0"
tree-sitter-odin = "1.3.0"
tree-sitter-pascal = "0.10.2"
tree-sitter-pgn = "1.4.3"
tree-sitter-php = "0.24.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-prolog = "0.1.0"
tree-sitter-properties = "0.3.0"
tree-sitter-proto = "0.6.0"
tree-sitter-ql = "0.23.1"
tree-sitter-ql-dbscheme = "0.23.1"
tree-sitter-qmljs = "0.3.1"
tree-sitter-r = "1.3.0"
tree-sitter-razor = "0.1.0"
tree-sitter-rst = "0.2.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.2"
tree-sitter-scheme = "0.24.7"
tree-sitter-slang = "0.3.1"
tree-sitter-slint = "0.24.0"
tree-sitter-solidity = "1.2.13"
tree-sitter-sparql = "0.25.2"
tree-sitter-swift = "0.7.3"
tree-sitter-t32 = "9.0.2"
tree-sitter-templ = "2.2.0"
tree-sitter-tera = "0.1.0"
tree-sitter-tlaplus = "1.5.0"
tree-sitter-vcl = "0.4.1"
tree-sitter-verilog = "1.0.3"
tree-sitter-vhdl = "1.4.0"
tree-sitter-wesl = "0.1.0"
tree-sitter-xml = "0.7.0"
tree-sitter-zig = "1.1.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
