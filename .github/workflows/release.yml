name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build static binary (musl cross)
        run: nix build .#tree-police-static

      - name: Stage build context
        run: |
          mkdir -p dist
          install -m755 result/bin/tree-police dist/tree-police

      # CycloneDX SBOM of the exact dependency set in Cargo.lock, built the
      # same reproducible way as the binary (see flake.nix's `sbom` package).
      - name: Build SBOM (nix)
        run: nix build .#sbom -o sbom-result

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@v3

      # Attaches to the exact digest just pushed (not a mutable tag), as an
      # OCI referrer in the same registry -- `cosign download sbom
      # ghcr.io/<repo>@<digest>` (or any OCI-referrers-aware scanner) finds
      # it from the image alone, no separate URL to track.
      - name: Attach SBOM to published image
        run: |
          cosign attach sbom \
            --type cyclonedx \
            --sbom sbom-result/bom.json \
            "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
