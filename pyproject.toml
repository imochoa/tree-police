# The package pre-commit / prek install for this repo's `tree-police` hook
# (.pre-commit-hooks.yaml, `language: python`). Hook installs run
# `pip install .` on a clone of this repo, so this root package is
# deliberately a stub: it contains nothing and only pins the prebuilt
# `tree-police` wheel from PyPI, so hook users never compile Rust.
#
# The real wheel is built from python/pyproject.toml (maturin). The pin below
# must equal Cargo.toml's version; `just release` bumps both, and
# tests/packaging.rs fails if they drift.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tree-police-pre-commit"
version = "0.3.0"
description = "pre-commit hook shim that installs the prebuilt tree-police wheel"
requires-python = ">=3.8"
dependencies = ["tree-police==0.3.0"]

[tool.hatch.build.targets.wheel]
bypass-selection = true
